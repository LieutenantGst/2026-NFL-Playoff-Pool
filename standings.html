<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standings</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #111a33;
      --card2: #0f1730;
      --text: #e8ecff;
      --muted: #a9b3da;
      --accent: #5eead4;
      --border: rgba(255,255,255,.12);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --sep: rgba(255,255,255,.22);
      --totalBorder: rgba(255,255,255,.40);
      --subtotalTint: rgba(94,234,212,.10);
      --totalTint: rgba(99,102,241,.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: 
        radial-gradient(1200px 500px at 20% -10%, rgba(94,234,212,.18), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(99,102,241,.22), transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 16px 44px;
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(17,26,51,.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: .2px;
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      max-width: 860px;
      line-height: 1.45;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(15,23,48,.55);
    }

    .nav {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(15,23,48,.65);
      color: var(--text);
      text-decoration: none;
      transition: transform .12s ease, border-color .12s ease;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(94,234,212,.45);
    }

    .card {
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(17,26,51,.75), rgba(15,23,48,.65));
      box-shadow: var(--shadow);
      padding: 14px;
      overflow-x: auto;
    }

    .hidden-col {
      display: none !important;
    }

    /* ===== TABLE ===== */
    #tbl {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
    }

    #tbl th,
    #tbl td {
      border: 1px solid rgba(255,255,255,.08);
      padding: 7px 8px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    #tbl th.name,
    #tbl td.name {
      text-align: left;
      font-weight: 700;
    }

    #tbl thead th {
      position: sticky;
      top: 0;
      background: rgba(15,23,48,.95);
      z-index: 2;
    }

    /* Column widths */
    col.c-rank     { width: 50px; }
    col.c-name     { width: 180px; }
    col.c-adv      { width: 72px; }
    col.c-spread   { width: 72px; }
    col.c-ou       { width: 54px; }
    col.c-subtotal { width: 70px; }
    col.c-pred     { width: 78px; }
    col.c-total    { width: 82px; }
    col.c-tb       { width: 60px; }

    .block-end {
      border-right: 2px solid var(--sep) !important;
    }

    .subtotal {
      background: var(--subtotalTint);
      font-weight: 800;
    }

    .totalcol {
      background: var(--totalTint);
      font-weight: 900;
      border-left: 3px solid var(--totalBorder) !important;
      border-right: 3px solid var(--totalBorder) !important;
    }

    #tbl thead .totalcol {
      border-top: 3px solid var(--totalBorder) !important;
    }

    #tbl tbody tr:last-child .totalcol {
      border-bottom: 3px solid var(--totalBorder) !important;
    }

    .tbcol {
      font-size: 12px;
      color: rgba(232,236,255,.85);
    }

    #msg {
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
      min-height: 1.3em;
    }

    @media (max-width: 900px) {
      .top { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Standings</h1>
        <p class="sub">Scores update when games are final.</p>
        <div class="nav">
          <a class="btn" href="index.html">Home</a>
          <a class="btn" href="wildcard.html">Wild Card Picks</a>
          <a class="btn" href="superbowl.html">Super Bowl Predictions</a>
        </div>
      </div>
      <div class="pill">Manual refresh</div>
    </div>

    <div id="msg">Loading…</div>

    <div class="card">
      <table id="tbl">
        <colgroup>
          <col class="c-rank">
          <col class="c-name">
          <!-- Wild Card -->
          <col class="c-adv"><col class="c-spread"><col class="c-ou"><col class="c-subtotal">
          <!-- Divisional -->
          <col class="c-adv"><col class="c-spread"><col class="c-ou"><col class="c-subtotal">
          <!-- Conference -->
          <col class="c-adv"><col class="c-spread"><col class="c-ou"><col class="c-subtotal">
          <!-- Super Bowl game -->
          <col class="c-adv"><col class="c-spread"><col class="c-ou">
          <!-- SB predictions -->
          <col class="c-pred"><col class="c-pred"><col class="c-pred"><col class="c-subtotal">
          <!-- Final total + tiebreaker -->
          <col class="c-total">
          <col class="c-tb">
        </colgroup>

        <thead>
          <tr>
            <th rowspan="2">Rank</th>
            <th rowspan="2" class="name">Entrant</th>
            <th colspan="4">Wild Card</th>
            <th colspan="4">Divisional</th>
            <th colspan="4">Conference Championships</th>
            <th colspan="7">Super Bowl</th>
            <th rowspan="2" class="totalcol">Total</th>
            <th rowspan="2" class="tbcol">Tie-breaker</th>
          </tr>
          <tr>
            <th>Adv</th><th>Spread</th><th>O/U</th><th class="subtotal block-end">Total</th>
            <th>Adv</th><th>Spread</th><th>O/U</th><th class="subtotal block-end">Total</th>
            <th>Adv</th><th>Spread</th><th>O/U</th><th class="subtotal block-end">Total</th>
            <th>Adv</th><th>Spread</th><th>O/U</th>
            <th>AFC</th><th>NFC</th><th>SB Champ</th><th class="subtotal block-end">Total</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  const msgEl   = document.getElementById("msg");

  function norm(s) {
    return String(s || "").trim().toLowerCase();
  }

  function splitCSVLine(line) {
    const out = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        out.push(cur.trim());
        cur = "";
      } else cur += ch;
    }
    out.push(cur.trim());
    return out;
  }

  function parseCSV(text) {
    const lines = text.replace(/\r/g, "").split("\n").filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = splitCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const cols = splitCSVLine(line);
      const obj = {};
      headers.forEach((h, i) => { obj[h] = cols[i] ?? ""; });
      return obj;
    });
  }

  async function fetchJsonWithFallback(urls) {
    for (const url of urls) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        if (r.ok) return await r.json();
      } catch {}
    }
    return { events: [] };
  }

  async function fetchTextOrNull(path) {
    try {
      const r = await fetch(path, { cache: "no-store" });
      return r.ok ? await r.text() : null;
    } catch {
      return null;
    }
  }

})();

</script>
</body>
</html>
